  </defs>
  <rect width="1600" height="1000" fill="#F6F1E7"/>
  <g filter="url(#watercolor)" opacity="0.5">
    <ellipse cx="260" cy="220" rx="340" ry="260" fill="#9FC9C3"/>
    <ellipse cx="1360" cy="180" rx="300" ry="240" fill="#E3D3AE"/>
    <ellipse cx="1300" cy="820" rx="360" ry="300" fill="#45737A" opacity="0.7"/>
    <ellipse cx="220" cy="840" rx="320" ry="260" fill="#7C8C5B" opacity="0.5"/>
    <ellipse cx="800" cy="500" rx="420" ry="300" fill="#9FC9C3" opacity="0.35"/>
  </g>
</svg>
